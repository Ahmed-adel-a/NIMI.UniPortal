name: Backend CI

on:
  push:
    branches: [main, dev, 'module/**']
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NIMI.UniPortal.sln

      - name: Build
        run: dotnet build NIMI.UniPortal.sln --no-restore -c Release

      # Integration tests need a real PostgreSQL (decision TESTDB). The runner image ships one,
      # stopped — start it and set a throwaway password. No Docker (decision NODOCKER).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          psql --version

      - name: Test
        env:
          PORTAL_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: dotnet test NIMI.UniPortal.sln --no-build -c Release --verbosity minimal
