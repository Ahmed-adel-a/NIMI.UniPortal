name: Backend image

# Decision DEVDOCKER: every merge to dev publishes the Cairo host image for the frontend developer
# (ghcr.io/<owner>/nimi-uniportal-cairo:dev and :sha-<commit>). Pull requests only build it, so a broken
# Dockerfile shows up before the merge. dev is merge-only behind the green 'build' check, so no tests run here.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nimi-uniportal-cairo" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/cairo-university/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:dev
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=NIMI UniPortal backend (Cairo University host) for frontend development
          cache-from: type=gha
          cache-to: type=gha,mode=max
